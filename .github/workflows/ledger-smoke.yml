name: Ledger build and smoke
on:
  push:
    branches: [feat/universal-ledger-foundation-20260920]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q ledger.py tests
      - name: End-to-end smoke
        run: python -m unittest discover -s tests -v
